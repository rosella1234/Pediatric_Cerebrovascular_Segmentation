[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pediatric-tof-mra"
version = "0.2.0"
description = "Unified pediatric TOF-MRA pipeline: nnU-Net segmentation, evaluation, and CaravelMetrics analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.25,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<3",
  "nibabel>=5.2,<6",
  "SimpleITK>=2.3,<3",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
nnunet = ["nnunetv2==2.6.2", "torch==2.6.0"]
caravel = ["networkx>=3.2,<4", "scikit-image>=0.22,<1", "scikit-learn>=1.3,<2", "nipype>=1.8,<2", "vedo>=2025,<2027", "openpyxl>=3.1,<4"]

[project.scripts]
tof-study = "tof_mra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

